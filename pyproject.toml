[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-embeddings"
version = "0.1.0"
description = "County-level frozen GeoFM and supervised Sentinel-2 yield benchmarks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
parquet = ["pyarrow>=14"]
tabular = [
  "xgboost>=2.0,<4",
  "interpret>=0.6,<0.8",
]

[project.scripts]
benchmark-supervised-s2 = "benchmark_embeddings.train:main"
benchmark-frozen-probe = "benchmark_embeddings.probe:main"
benchmark-extract-clay = "benchmark_embeddings.frozen.clay:main"
benchmark-extract-presto = "benchmark_embeddings.frozen.presto:main"
benchmark-extract-terramind = "benchmark_embeddings.frozen.terramind:main"
benchmark-extract-prithvi = "benchmark_embeddings.frozen.prithvi:main"
benchmark-temporal-ablation = "benchmark_embeddings.temporal_ablation:main"
benchmark-aggregate-temporal-ablation = "benchmark_embeddings.temporal_ablation_aggregate:main"
benchmark-main-loyo = "benchmark_embeddings.loyo:main"
benchmark-tabular-regression = "benchmark_embeddings.regression_benchmark:main"
benchmark-audit-experiment-parity = "benchmark_embeddings.experiment_parity:main"
benchmark-aggregate-supervised = "benchmark_embeddings.supervised_aggregate:main"
benchmark-aggregate-loso = "benchmark_embeddings.loso_aggregate:main"
benchmark-prepare-alphaearth = "benchmark_embeddings.prepare_alphaearth:main"
benchmark-build-splits = "benchmark_embeddings.build_splits:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark_embeddings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
